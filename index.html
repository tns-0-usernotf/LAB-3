<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống Phát hiện Té ngã - Lab 3 Đề 5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #2c3e50; }
    h1 { text-align: center; margin-bottom: 5px; }
    .status-bar { text-align: center; margin-bottom: 20px; font-weight: bold; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .metric-label { font-size: 14px; color: #7f8c8d; text-transform: uppercase; }
    .metric-value { font-size: 28px; font-weight: bold; color: #2980b9; margin: 10px 0; }
    .alert-safe { background: #d4edda; color: #155724; }
    .alert-danger { background: #f8d7da; color: #721c24; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
    .control-panel { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
    .btn-control { padding: 12px 28px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background: #34495e; transition: 0.2s; }
    .btn-control.active-led { background: #e74c3c; }
    .btn-control.active-buzzer { background: #f39c12; }
    .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-box { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    @media (max-width: 768px) { .charts-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <h1>HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN TÉ NGÃ (FALL DETECTION)</h1>
  <div class="status-bar" id="mqtt-status">Trạng thái MQTT: Đang kết nối...</div>

  <!-- Các thẻ HTML class hiển thị dữ liệu gia tốc và góc nghiêng dạng số -->
  <div class="grid-cards">
    <div class="card">
      <div class="metric-label">Gia tốc tổng hợp (SVM)</div>
      <div class="metric-value val-acc">0.00 m/s²</div>
      <small class="val-xyz">Ax: 0 | Ay: 0 | Az: 0</small>
    </div>
    <div class="card">
      <div class="metric-label">Góc nghiêng Roll</div>
      <div class="metric-value val-roll">0.0 °</div>
    </div>
    <div class="card">
      <div class="metric-label">Góc nghiêng Pitch</div>
      <div class="metric-value val-pitch">0.0 °</div>
    </div>
    <div class="card alert-safe" id="fall-card">
      <div class="metric-label">Trạng thái cơ thể</div>
      <div class="metric-value val-state">BÌNH THƯỜNG</div>
    </div>
  </div>

  <!-- 2 nút button điều khiển trạng thái LED và Loa cảnh báo (chế độ Manual) -->
  <div class="control-panel">
    <button class="btn-control" id="btn-led" onclick="toggleDevice('led')">LED Cảnh báo: TẮT (Manual)</button>
    <button class="btn-control" id="btn-buzzer" onclick="toggleDevice('buzzer')">Loa Cảnh báo: TẮT (Manual)</button>
  </div>

  <!-- 2 biểu đồ cập nhật dữ liệu gia tốc và góc nghiêng theo thời gian thực -->
  <div class="charts-container">
    <div class="chart-box">
      <canvas id="accChart"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="angleChart"></canvas>
    </div>
  </div>

  <script>
    const BROKER = "broker.emqx.io";
    const PORT = 8083;
    const TOPIC_DATA = "esp32/fall_detection/lab3_de5/data";
    const TOPIC_CONTROL = "esp32/fall_detection/lab3_de5/control";

    let ledState = false;
    let buzzerState = false;

    // Khởi tạo Biểu đồ 1: Gia tốc
    const accChart = new Chart(document.getElementById('accChart').getContext('2d'), {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Gia tốc tổng hợp (m/s²)', data: [], borderColor: '#e74c3c', tension: 0.3, fill: false }] },
      options: { responsive: true, scales: { y: { suggestedMin: 0, suggestedMax: 30 } } }
    });

    // Khởi tạo Biểu đồ 2: Góc nghiêng Roll & Pitch
    const angleChart = new Chart(document.getElementById('angleChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Roll (°)', data: [], borderColor: '#2980b9', tension: 0.3, fill: false },
          { label: 'Pitch (°)', data: [], borderColor: '#27ae60', tension: 0.3, fill: false }
        ]
      },
      options: { responsive: true, scales: { y: { suggestedMin: -90, suggestedMax: 90 } } }
    });

    // Kết nối MQTT qua WebSocket
    const clientID = "WebClient_" + Math.random().toString(16).substr(2, 8);
    const client = new Paho.MQTT.Client(BROKER, PORT, "/mqtt", clientID);

    client.onConnectionLost = (res) => {
      document.getElementById("mqtt-status").innerText = "Mất kết nối MQTT: " + res.errorMessage;
    };

    client.onMessageArrived = (message) => {
      if (message.destinationName === TOPIC_DATA) {
        const data = JSON.parse(message.payloadString);
        const now = new Date().toLocaleTimeString();

        // Cập nhật các thẻ HTML class
        document.querySelector(".val-acc").innerText = data.totalAcc.toFixed(2) + " m/s²";
        document.querySelector(".val-xyz").innerText = `Ax: ${data.ax.toFixed(1)} | Ay: ${data.ay.toFixed(1)} | Az: ${data.az.toFixed(1)}`;
        document.querySelector(".val-roll").innerText = data.roll.toFixed(1) + " °";
        document.querySelector(".val-pitch").innerText = data.pitch.toFixed(1) + " °";

        const fallCard = document.getElementById("fall-card");
        const stateText = document.querySelector(".val-state");
        if (data.isFall) {
          fallCard.className = "card alert-danger";
          stateText.innerText = "CẢNH BÁO TÉ NGÃ!";
        } else {
          fallCard.className = "card alert-safe";
          stateText.innerText = "BÌNH THƯỜNG";
        }

        // Cập nhật 2 biểu đồ thời gian thực (giữ tối đa 15 điểm)
        if (accChart.data.labels.length >= 15) {
          accChart.data.labels.shift();
          accChart.data.datasets[0].data.shift();
          angleChart.data.labels.shift();
          angleChart.data.datasets[0].data.shift();
          angleChart.data.datasets[1].data.shift();
        }
        accChart.data.labels.push(now);
        accChart.data.datasets[0].data.push(data.totalAcc);
        accChart.update();

        angleChart.data.labels.push(now);
        angleChart.data.datasets[0].data.push(data.roll);
        angleChart.data.datasets[1].data.push(data.pitch);
        angleChart.update();
      }
    };

    client.connect({
      onSuccess: () => {
        document.getElementById("mqtt-status").innerText = "Trạng thái MQTT: Đã kết nối (" + BROKER + ")";
        client.subscribe(TOPIC_DATA);
      }
    });

    // Gửi lệnh điều khiển Manual khi nhấn Button
    function toggleDevice(device) {
      if (device === 'led') {
        ledState = !ledState;
        const btn = document.getElementById('btn-led');
        btn.innerText = "LED Cảnh báo: " + (ledState ? "BẬT (Manual)" : "TẮT (Manual)");
        btn.classList.toggle('active-led', ledState);
      } else if (device === 'buzzer') {
        buzzerState = !buzzerState;
        const btn = document.getElementById('btn-buzzer');
        btn.innerText = "Loa Cảnh báo: " + (buzzerState ? "BẬT (Manual)" : "TẮT (Manual)");
        btn.classList.toggle('active-buzzer', buzzerState);
      }

      const payload = JSON.stringify({ manualLed: ledState, manualBuzzer: buzzerState });
      const msg = new Paho.MQTT.Message(payload);
      msg.destinationName = TOPIC_CONTROL;
      client.send(msg);
    }
  </script>
</body>
</html>
